<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Love Surprise</title> <style> body{ margin:0; background:black; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; font-family:sans-serif; color:white; text-align:center; } .container{ position:relative; } img{ width:320px; border-radius:20px; box-shadow:0 0 25px rgba(255,0,0,0.6); } #girl{ position:absolute; top:0; left:0; opacity:0; transition:1s; } .heart{ position:absolute; font-size:70px; left:50%; top:45%; transform:translate(-50%,0); opacity:0; } .message{ margin-top:20px; font-size:28px; opacity:0; transition:1s; } #start{ font-size:26px; padding:15px 30px; border:none; border-radius:12px; background:red; color:white; cursor:pointer; box-shadow:0 0 20px red; } @keyframes heartMove{ 0%{ opacity:0; transform:translate(-50%,0) scale(0.5); } 50%{ opacity:1; transform:translate(-50%,-120px) scale(1.3); } 100%{ opacity:0; transform:translate(-50%,-220px) scale(2); } } </style> </head> <body> <div id="startScreen"> <button id="start">Tap to Open Love ❤️</button> </div> <div class="container" id="main" style="display:none"> <img id="boy" src="boy.jpg"> <img id="girl" src="girl.jpg"> <div class="heart" id="heart">❤️</div> <div class="message" id="text"> You are my life ❤️ </div> </div> <script> document.getElementById("start").onclick = function(){ document.getElementById("startScreen").style.display="none" document.getElementById("main").style.display="block" let heart = document.getElementById("heart") setTimeout(()=>{ heart.style.opacity="1" heart.style.animation="heartMove 3s forwards" },2000) setTimeout(()=>{ document.getElementById("boy").style.opacity="0" document.getElementById("girl").style.opacity="1" },5000) setTimeout(()=>{ document.getElementById("text").style.opacity="1" },6500) } </script> </body> </html>
